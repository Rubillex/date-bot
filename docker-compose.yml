services:
  # Nuxt NODE process
  nuxt-basic-frontend:
    container_name: nuxt-basic-frontend
    build:
      context: .
      dockerfile: ./deploy/development/node/Dockerfile
    image: nuxt-basic-frontend
    ports:
      - "${PORT:-3002}:3000"
    networks:
      - remnawave-network

networks:
  remnawave-network:
    name: remnawave-network
    driver: bridge
    external: true
