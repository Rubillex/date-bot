services:
  date-bot-db:
    container_name: date-bot-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-date_bot}
      POSTGRES_USER: ${POSTGRES_USER:-date_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-date_bot_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - date-bot-db-data:/var/lib/postgresql/data
    networks:
      - remnawave-network

  # Nuxt NODE process
  nuxt-basic-frontend:
    container_name: nuxt-basic-frontend
    build:
      context: .
      dockerfile: ./deploy/development/node/Dockerfile
    image: nuxt-basic-frontend
    depends_on:
      - date-bot-db
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql://date_bot:date_bot_password@date-bot-db:5432/date_bot}
      UPLOAD_DIR: /app/public/uploads
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_RECIPIENT_CHAT_ID: ${TELEGRAM_RECIPIENT_CHAT_ID:-}
    ports:
      - "${PORT:-3002}:3000"
    volumes:
      - date-bot-uploads:/app/public/uploads
    networks:
      - remnawave-network

volumes:
  date-bot-db-data:
  date-bot-uploads:

networks:
  remnawave-network:
    name: remnawave-network
    driver: bridge
    external: true
